# N-Ways Addressing for Benin: registry API (OpenAPI 3.1). Examples are real responses (lists shortened).
openapi: 3.1.0
info:
  title: 'N-Ways Addressing for Benin: registry API'
  version: '1.0'
  description: 'Serves the published registry of N-Ways codes for Benin and, on the designated issuer only, issues new codes
    by the same rules as the N-Ways issuer. Every example is a real response. Errors: {"error": {"code", "message"}}. See
    docs/api.md.'
  license:
    name: Apache-2.0 (code); ODbL-1.0 (data)
    identifier: Apache-2.0
  contact:
    name: N-WAYS LIMITED
    url: https://nways.ng
    email: hello@nways.ng
servers:
- url: /
  description: This deployment (docker compose up serves it on port 8080).
tags:
- name: Service
  description: Health and description of the deployment.
- name: Codes
  description: Looking up and checking codes.
- name: Places
  description: Codes and spot codes of points on the ground.
- name: Communes and areas
  description: The communes (registry files) and code areas (quartiers and villages).
- name: Issuing
  description: New codes and changes; the designated issuer only.
paths:
  /v1/health:
    get:
      summary: Health
      description: Liveness and the registry in service.
      tags:
      - Service
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    country: BJ
                    codes: 4147741
                    registry_exported: '2026-10-20T19:51:08Z'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrong_method:
                  value:
                    error:
                      code: method_not_allowed
                      message: DELETE is not allowed here; use GET.
      security: []
  /v1/info:
    get:
      summary: Info
      description: Country, counts, licences, credit line and whether this deployment issues codes.
      tags:
      - Service
      operationId: info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
              examples:
                benin:
                  value:
                    country: BJ
                    name: Benin
                    codes:
                      total: 4147741
                      by_status:
                        provisional: 4147741
                    zones: 77
                    areas: 12964
                    zone_kind: commune
                    area_kind: quartier or village
                    registry:
                      exported: '2026-10-20T19:51:08Z'
                      imported_at: '2026-10-21T13:39:29Z'
                      codes: 4147741
                      local_changes: false
                    issuing:
                      enabled: false
                      per_key_per_day: 5
                    engine: internal/addressing/bj (SPEC v1.0)
                    spec: engine/SPEC.md 1.0
                    spatial_index: rtree
                    licences:
                      data: ODbL 1.0 (LICENSE-DATA)
                      code: Apache License 2.0 (LICENSE, NOTICE)
                      documents: CC BY 4.0 (LICENSE-DOCS)
                    credit: N-Ways Addressing for Benin, © N-WAYS LIMITED (nways.ng)
                    credit_url: https://github.com/n-ways/open-addresses-benin
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrong_method:
                  value:
                    error:
                      code: method_not_allowed
                      message: DELETE is not allowed here; use GET.
      security: []
  /v1/codes/{machine}:
    get:
      summary: Get code
      description: The full card of one code. The check digit may be left off; a wrong one is refused.
      tags:
