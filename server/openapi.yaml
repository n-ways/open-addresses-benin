        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
            examples:
              new_home:
                value:
                  lat: 7.2167
                  lng: 2.3442
                  outline:
                  - - 2.34414
                    - 7.21665
                  - - 2.34426
                    - 7.21665
                  - - 2.34426
                    - 7.21675
                  - - 2.34414
                    - 7.21675
              another_door:
                value:
                  lat: 7.21705
                  lng: 2.34285
                  of: BJ-COV-04-001-1044-3
      security:
      - issuingKey: []
components:
  schemas:
    Error:
      type: object
      description: Every error.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable error code for programs.
              enum:
              - bad_parameter
              - missing_parameter
              - bad_body
              - bad_outline
              - body_too_large
              - invalid_code
              - invalid_spot
              - check_digit
              - not_in_area
              - unknown_area
              - unknown_name
              - unknown_zone
              - wrong_digits
              - wrong_commune
              - not_issued
              - retired
              - not_found
              - no_code_at_spot
              - outside_country
              - no_area
              - unauthorized
              - read_only
              - rate_limited
              - exists
              - area_full
              - too_far
              - method_not_allowed
              - no_such_endpoint
              - internal
            message:
              type: string
              description: Plain-English explanation for people.
            machine:
              type: string
              description: 'With `exists`: the code the building already has.'
    AreaBrief:
      type: object
      description: A code area (quartier or village).
      properties:
        zone:
          type: string
          description: 'Area key: commune, arrondissement, quartier.'
          examples:
          - COT-12-001
        id:
          type: integer
        plate_name:
          type: string
          description: The name in the code (at most 12 characters, 2 words).
        official_name:
          type: string
        provisional_name:
          type: boolean
          description: The commune may still choose the plate name once; the numbers never change.
        commune_key:
          type: string
        commune:
          type: string
        arrondissement:
          type: string
        departement:
          type: string
    Card:
      type: object
      description: One issued code.
      properties:
        machine:
          type: string
          description: Machine form, with the check digit (for systems).
          pattern: ^BJ-[A-Z]{3}-\d{2}-\d{3}-\d{4,5}-\d$
        home:
          type: string
          description: Remembered form.
        written:
          type: string
          description: 'Written form: name · number in pairs, no check digit.'
        spoken:
          type: string
        display:
          type: string
          description: 'What to show first: the official address where the State has one, else the written form.'
        zone:
          type: string
        number:
          type: integer
        check:
          type: integer
        status:
          type: string
          enum:
          - provisional
          - confirmed
          - retired
        issued:
          type: string
          enum:
          - bulk
          - on-demand
        issued_at:
          type: string
          format: date-time
        entrance:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
            kind:
              type: string
              enum:
              - centre
              - door
              - gate
        spot_code:
          type: string
        plus_code:
          type: string
        official_address: &id001
          type:
          - string
          - 'null'
        official_name:
          type: string
        area:
          $ref: '#/components/schemas/AreaBrief'
        profile:
          type: object
          properties:
            class: *id001
            use: *id001
            kind: *id001
            structures:
              type: integer
            floor_area_m2:
              type: number
            rule: *id001
            estate: *id001
        registry:
          type: object
          description: The published registry row, every column as written in registry/<commune>.csv.gz.
          additionalProperties:
            type: string
        credit:
          type: string
    Find:
      type: object
      properties:
        query:
          type: string
        kind:
          type: string
          enum:
          - remembered
          - machine
          - official_address
          - spot
        count:
          type: integer
        more:
          type: boolean
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    At:
      type: object
      properties:
        status:
          type: string
          enum:
          - found
          - none
        distance_m:
          type: integer
        code:
          $ref: '#/components/schemas/Card'
        can_issue:
          type: boolean
        area:
          $ref: '#/components/schemas/AreaBrief'
    Near:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        radius_m:
          type: number
        count:
          type: integer
        more:
          type: boolean
        codes:
          type: array
          items:
            type: object
            properties:
              distance_m:
                type: number
              code:
                $ref: '#/components/schemas/Card'
    Verify:
      type: object
      properties:
        code:
          type: string
        valid:
          type: boolean
        syntax:
          type: boolean
        check_digit:
          type:
          - string
          - 'null'
          enum:
          - ok
          - wrong
          - missing
          - null
        issued:
          type: boolean
        status: *id001
        machine: *id001
        zone: *id001
        reason: *id001
    Spot:
      type: object
      properties:
        spot_code:
          type: string
        machine:
          type: string
        commune:
          type: string
        arrondissement:
          type: string
        cell_m:
          type: number
        centre:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
    Zone:
      type: object
      description: A commune.
      properties:
        key:
          type: string
        name:
          type: string
        departement:
          type: string
        areas:
          type: integer
        codes:
          type: integer
        file:
          type: string
    Zones:
      type: object
      properties:
        count:
          type: integer
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
    ZoneDetail:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        departement:
          type: string
        codes:
          type: integer
        file:
          type: string
        areas:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/AreaBrief'
            - type: object
              properties:
                blocks:
                  type: array
                  items:
                    type: array
                    items:
                      type: integer
                    minItems: 2
                    maxItems: 2
                codes:
                  type: integer
    ZonePage:
      type: object
      properties:
        zone:
          type: string
        count:
          type: integer
        codes:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        next: *id001
    AreaDetail:
      allOf:
      - $ref: '#/components/schemas/AreaBrief'
      - type: object
        properties:
          name_key:
            type: string
          name_index:
            type: integer
          digits:
            type: integer
            enum:
            - 4
            - 5
          blocks:
            type: array
            items:
              type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
          place:
            type:
            - object
            - 'null'
          frame:
            type:
            - array
            - 'null'
            items:
              type: number
          codes:
            type: object
            properties:
              total:
                type: integer
              by_status:
                type: object
                additionalProperties:
                  type: integer
          numbers:
            type: object
            properties:
              lowest:
                type:
                - integer
                - 'null'
              highest:
                type:
                - integer
                - 'null'
          same_name:
            type: array
            items:
              type: string
    Areas:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaDetail'
    Health:
      type: object
      properties:
        status:
          type: string
        country:
          type: string
        codes:
          type: integer
        registry_exported:
          type: string
          format: date-time
    Info:
      type: object
      properties:
        country:
          type: string
        name:
          type: string
        codes:
          type: object
        zones:
          type: integer
        areas:
          type: integer
        zone_kind:
          type: string
        area_kind:
          type: string
        spatial_index:
          type: string
          enum:
          - rtree
          - grid
        registry:
          type: object
        issuing:
          type: object
        engine:
          type: string
        spec:
          type: string
        licences:
          type: object
        credit:
          type: string
        credit_url:
          type: string
    IssueRequest:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        outline:
          type: array
          description: The building outline as [lng, lat] pairs (6 m² to 2 ha).
          maxItems: 500
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        of:
          type: string
          description: Machine code of the compound this is another door of (within 80 m).
    PatchRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - provisional
          - confirmed
          - retired
        entrance:
          type: object
          required:
          - lat
          - lng
          properties:
            lat:
              type: number
            lng:
              type: number
  securitySchemes:
    issuingKey:
      type: http
      scheme: bearer
      description: A key from ISSUE_KEYS (issuer only).
